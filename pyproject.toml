[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentarmour-toolkit"
version = "0.1.1"
description = "Production reliability suite for LangChain/LangGraph multi-agent systems"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Saravanan S", email = "saravanansd634@email.com" }]
keywords = [
    "langgraph",
    "langchain",
    "circuit-breaker",
    "multi-agent",
    "llm",
    "fault-tolerance",
    "self-healing",
    "agentarmour",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
cascadebreaker = [
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
]
storage = []
dashboard = [
    "streamlit>=1.35.0",
    "plotly>=5.0.0",
    "pandas>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]
all = ["agentarmour-toolkit[cascadebreaker,storage,dashboard,dev]"]
langgraph = [
    "langchain-core>=1.3.2",
    "langgraph>=1.1.10",
]

[project.scripts]
agentarmour = "agentarmour.cascadebreaker.cli:main"

[project.urls]
Homepage = "https://github.com/Saravanan-SD/agentarmour"
Repository = "https://github.com/Saravanan-SD/agentarmour"
Issues = "https://github.com/Saravanan-SD/agentarmour/issues"

[tool.hatch.build.targets.wheel]
packages = ["agentarmour"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]
